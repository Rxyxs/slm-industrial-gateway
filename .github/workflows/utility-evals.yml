name: Utility evals

# Mide si el SLM, con el contexto inyectado, propone el ajuste que pide la regla operativa
# (tests/evals). Corre un modelo real en CPU, así que no va en cada push: a mano y una vez
# por semana.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model"
        default: "qwen2.5:1.5b-instruct"
      limit:
        description: "Cases (split evenly across ADJUST / HOLD / near-miss)"
        default: "30"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  utility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UTILITY_MODEL: ${{ github.event.inputs.model || 'qwen2.5:1.5b-instruct' }}
      UTILITY_LIMIT: ${{ github.event.inputs.limit || '30' }}
      UTILITY_DEADLINE_S: "120"
      OLLAMA_URL: http://127.0.0.1:11434

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-gateway-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gateway-dev.txt

      - name: Start Ollama (CPU) and pull the model
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:0.12.6
          until curl -sf $OLLAMA_URL/api/tags > /dev/null; do sleep 2; done
          docker exec ollama ollama pull "$UTILITY_MODEL"

      - name: Run utility evals
        run: pytest -v -s tests/evals
